name: Build Debian packages

on:
  workflow_dispatch:
    inputs:
      build-number:
        description: 'Build number'
        type: string
        default: '1'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gir1.2-pango-1.0 \
          gir1.2-gtk-3.0 \
          xdg-utils \
          librsvg2-common \
          libglib2.0-dev \
          intltool \
          python3-gi \
          python3-cairo \
          python3-gi-cairo \
          python3-bsddb3 \
          python3-dev \
          python3-mock \
          python3-icu \
          python3-coverage \
          python3-jsonschema \
          libxml2-utils \
          python3-lxml \
          python3-libxml2 \
          zlib1g-dev \
          python3-setuptools \
          python3-build \
          python3-hatchling \
          pybuild-plugin-pyproject \
          devscripts \
          debhelper \
          dh-python \
          python3-all

    - name: Sanitize artifact name
      run: |
        # Safely convert branch slashes into clean dashes for filenames
        echo "ARTIFACT_NAME=Gramps_deb_$(echo '${{ github.ref_name }}' | tr '/\\' '--')" >> $GITHUB_ENV

    - name: Build deb package
      run: |
        # 1. Patch pyproject.toml license-files array configuration to pass system hatchling validation
        sed -i 's/license-files = \["COPYING"\]/\[project.license-files\]\npaths = \["COPYING"\]/' pyproject.toml

        # 2. Generate the distribution source tarball cleanly
        python3 -m build --sdist

        # 3. Extract version safely directly from the generated filename
        VERSION=$(ls dist/gramps-*.tar.gz | sed 's/dist\/gramps-//;s/\.tar\.gz//')
        echo "Detected Gramps version: $VERSION"

        if grep -q '^DEV_VERSION\s*=\s*True' gramps/version.py; then
          appbuild=$(git rev-parse --short $GITHUB_SHA)
        else
          appbuild=${{ inputs.build-number }}
        fi

        # 4. Append your custom entry directly to the top of the existing changelog
        DEBFULLNAME="Gramps Project" DEBEMAIL="noreply@gramps-project.org" debchange -b -v "$VERSION"-"$appbuild" "Custom fork compilation package build."

        # 5. Correctly structure the original source package in the parent folder
        cp dist/gramps-"$VERSION".tar.gz dist/gramps_"$VERSION".orig.tar.gz

        cd dist
        tar zxf gramps-"$VERSION".tar.gz
        cd gramps-"$VERSION"

        # Patch the internal pyproject configuration copy as well before debuild reads it
        sed -i 's/license-files = \["COPYING"\]/\[project.license-files\]\npaths = \["COPYING"\]/' pyproject.toml

        # 6. Bring our newly updated debian configuration folder into the build directory
        cp -r ../../debian .

        # 7. Strip out custom clean rules and remove the breaking nosetests3 target execution block
        sed -i '/rm -rf data\/tips.xml/d' debian/rules
        sed -i '/rm -rf gramps\/plugins\/lib\/holidays.xml/d' debian/rules
        sed -i '/debian\/rules override_dh_clean/d' debian/rules
        sed -i '/override_dh_auto_test:/,/nosetests3/d' debian/rules

        # 8. Set tracking environment configurations
        mkdir .git
        mkdir -p build/.gramps
        export LANG=en_US.utf8

        # 9. Compile forcing architecture-independent outputs (-A) to guarantee a .deb file
        export DEB_BUILD_OPTIONS=nocheck
        debuild -us -uc -d -A

        cd /home/runner/work/gramps/gramps/dist

        # 10. Locate and rename the output .deb file dynamically using your sanitized variable name
        DEB_FILE=$(ls gramps_*.deb)
        mv "$DEB_FILE" "${{ env.ARTIFACT_NAME }}.deb"

    - uses: actions/upload-artifact@v6
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: /home/runner/work/gramps/gramps/dist/*.deb
        retention-days: 7

    - name: Build deb package
      run: |
        # 1. Generate the distribution file cleanly
        python3 -m build --sdist
        
        # 2. Extract version safely directly from the generated filename
        VERSION=$(ls dist/gramps-*.tar.gz | sed 's/dist\/gramps-//;s/\.tar\.gz//')
        echo "Detected Gramps version: $VERSION"
        
        if grep -q '^DEV_VERSION\s*=\s*True' gramps/version.py; then
          appbuild=$(git rev-parse --short $GITHUB_SHA)
        else
          appbuild=${{ inputs.build-number }}
        fi
        
        # 3. Append your custom entry directly to the top of the existing changelog
        DEBFULLNAME="Gramps Project" DEBEMAIL="noreply@gramps-project.org" debchange -b -v "$VERSION"-"$appbuild" "Custom fork compilation package build."
        
        # 4. Correctly structure the original source package in the parent folder
        cp dist/gramps-"$VERSION".tar.gz dist/gramps_"$VERSION".orig.tar.gz
        
        cd dist
        tar zxf gramps-"$VERSION".tar.gz
        cd gramps-"$VERSION"
        
        # 5. Bring our newly updated debian configuration folder into the build directory
        cp -r ../../debian .
        
        # to allow resourcepath detection :
        mkdir .git
        # to make mediapath test successful :
        mkdir -p build/.gramps
        export LANG=en_US.utf8
        
        # 6. Compile using the continuous integration non-interactive flag (-us -uc)
        debuild -us -uc
        
        cd /home/runner/work/gramps/gramps/dist
        mv gramps_${VERSION}-${appbuild}_all.deb gramps_${VERSION}-${appbuild}_all.${{ matrix.os }}.deb

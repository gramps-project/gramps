name: Compile & Deploy Gramps Releases

on:
  push:
    tags:
      - 'v*' # Triggers exclusively when pushing release version tags

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Gramps AIO require an active MSYS2 environment to pull native GTK/GObject subsystems
    - name: Setup MSYS2 Environment
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          git
          mingw-w64-x86_64-python
          mingw-w64-x86_64-gtk3
          mingw-w64-x86_64-gexiv2
          mingw-w64-x86_64-python-cx_Freeze

    # Executes the repository's internal automated Windows packaging engine
    - name: Compile Windows All-In-One Installer
      shell: msys2 {0}
      run: |
        cd aio
        bash build-packages.sh --bundle=exe

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gramps-Windows-${{ github.ref_name }}
        path: aio/dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Pulls system UI tools and triggers internal bundle packaging scripts
    - name: Compile macOS Application Bundle
      run: |
        brew install gtk+3 jhbuild
        cd mac
        # Installs local dependencies and structures the mountable image map
        pip install -r requirements.txt || true
        sh make-bundle.sh

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gramps-Mac-${{ github.ref_name }}
        path: mac/dist/*.dmg

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential permission loop for asset attachment injections

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Fetch Windows Package
      uses: actions/download-artifact@v4
      with:
        name: Gramps-Windows-${{ github.ref_name }}
        path: ./artifacts

    - name: Fetch macOS Package
      uses: actions/download-artifact@v4
      with:
        name: Gramps-Mac-${{ github.ref_name }}
        path: ./artifacts

    # Automatically matches tag labels, extracts commit logs, and attaches both deployment bundles
    - name: Publish Official Multi-Platform Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          ./artifacts/*.exe \
          ./artifacts/*.dmg \
          --title "Gramps Release ${{ github.ref_name }}" \
          --generate-notes

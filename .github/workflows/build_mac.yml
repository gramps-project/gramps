name: Build macOS Application (.dmg)

on:
  workflow_dispatch:
    inputs:
      build-number:
        description: 'Build number'
        type: string
        required: true
        default: '1'
  push:
    branches:
      - gg_beta
      - grizard_plugin

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install macOS System Dependencies
      run: |
        brew update
        brew install gtk+3 gobject-introspection pygobject3 cairo adwaita-icon-theme intltool gettext
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH

    - name: Install Python Build Dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install hatchling build py2app setuptools pycairo

    - name: Sanitize artifact name
      id: sanitize
      env:
        RAW_REF_NAME: ${{ github.ref_name }}
      run: |
        CLEAN_NAME="Gramps_mac_$(echo "$RAW_REF_NAME" | tr '/\\' '--')"
        echo "ARTIFACT_NAME=$CLEAN_NAME" >> $GITHUB_ENV

    - name: Package and Create DMG
      env:
        INPUT_BUILD_NUMBER: ${{ github.event.inputs.build-number || '1' }}
      run: |
        # 1. Patch pyproject.toml license-files array configuration to pass hatchling validation
        sed -i '' 's/license-files = \["COPYING"\]/\[project.license-files\]\npaths = \["COPYING"\]/' pyproject.toml

        # 2. Generate the distribution source tarball cleanly
        python3 -m build --sdist
        
        # 3. Extract version safely directly from the generated filename
        VERSION=$(ls dist/gramps-*.tar.gz | sed 's/dist\/gramps-//;s/\.tar\.gz//')
        echo "Detected Gramps version: $VERSION"
        
        if grep -q '^DEV_VERSION\s*=\s*True' gramps/version.py; then
          appbuild=$(git rev-parse --short $GITHUB_SHA)
        else
          appbuild="$INPUT_BUILD_NUMBER"
        fi
        
        # 4. Extract the source distribution package contents
        cd dist
        tar zxf gramps-"$VERSION".tar.gz
        cd gramps-"$VERSION"

        # 5. Remove conflicting configuration files entirely to prevent py2app setuptools crash
        rm -f pyproject.toml setup.cfg

        # 6. FIXED: Generate a template setup.py with safe string literals to prevent Bash parser collisions
        cat << 'INNER_EOF' > setup.py
from setuptools import setup

APP = ['TARGET_WORKSPACE_PATH/Mac/mac_only/Gramps.py']
DATA_FILES = []
OPTIONS = {
    'argv_emulation': False,
    'plist': {
        'CFBundleIdentifier': 'org.gramps-project.gramps',
    }
}

setup(
    app=APP,
    data_files=DATA_FILES,
    options={'py2app': OPTIONS},
    setup_requires=['py2app'],
)
INNER_EOF
        
        # 7. FIXED: Dynamically patch the file with the absolute workspace string path safely via sed
        sed -i '' "s|TARGET_WORKSPACE_PATH|$GITHUB_WORKSPACE|g" setup.py

        # 8. Compile application bundle cleanly using the patched absolute configuration layout
        python3 setup.py py2app --semi-standalone

        # 9. Structure the directory for DMG packaging cleanly using dynamic workspace tracks
        cd "$GITHUB_WORKSPACE"
        mkdir -p dmg_root
        mv dist/gramps-"$VERSION"/dist/Gramps.app dmg_root/

        # 10. Generate the downloadable .dmg installer using native macOS diskutil tools
        mkdir -p output_dist
        hdiutil create -volname "Gramps Installation" -srcfolder dmg_root -ov -format UDZO "output_dist/${ARTIFACT_NAME}.dmg"

    - name: Upload macOS Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: output_dist/*.dmg
        retention-days: 7
